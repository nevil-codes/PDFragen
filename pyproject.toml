[project]
name = "pdfragen"
version = "0.1.0"
description = "German-language RAG chatbot for question answering over PDF documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langchain>=0.2.0",
    "langchain-ollama>=0.1.0",
    "chromadb>=0.5.0",
    "langchain-chroma>=0.1.0",
    "sentence-transformers>=3.0.0",
    "langchain-huggingface>=0.1.0",
    "pypdf>=4.2.0",
    "streamlit>=1.36.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
eval = ["pyyaml>=6.0", "lingua-language-detector>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
